      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

36 \u2192 32 missed)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;62.9%\u0026quot;' data-label='\u0026quot;Prophage Exact (5\u0026#x27;+3\u0026#x27;) Recall\u0026quot;' data-caption='\u0026quot;+1.4% (+8 exact 5\u0026#x27; starts rescued)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;91.5%\u0026quot;' data-label='\u0026quot;Host Chromosome Recall\u0026quot;' data-caption='\u0026quot;4,193 intact host CDSs (75.4% exact)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;+5 ORFs\u0026quot;' data-label='\u0026quot;Newly Rescued Prophage ORFs\u0026quot;' data-caption='\u0026quot;Across 9 cryptic \u0026amp; lambdoid prophages (4,406 total CDSs)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;24.7 Mb/s\u0026quot;' data-label='\u0026quot;Single-Pass Throughput\u0026quot;' data-caption='\u0026quot;188 ms wall time on 4.66 Mb chromosome\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003C/div\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eKey Takeaway\u0026#92;u003c/strong\u0026#92;u003e: Cryptic and lambdoid prophages exhibit sharp local GC shifts relative to the host chromosome. Unified \u0026#92;u003ccode\u0026#92;u003eOrfPredictor\u0026#92;u003c/code\u0026#92;u003e (\u0026#92;u003ccode\u0026#92;u003eGeneticCode.bacterial\u0026#92;u003c/code\u0026#92;u003e, 4-kb sliding local GC window, faithful 29-state \u0026#92;u003ccode\u0026#92;u003eFragGeneScanRs\u0026#92;u003c/code\u0026#92;u003e Viterbi) co-predicts bacterial and prophage ORFs in a single pass with zero two-pass overhead.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "62080d0c8a9f9373ee73084025181740", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1.0rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-sliding-4-kb-local-gc-adaptation-across-prophage-islands\"\u003E1. Sliding 4-kb Local GC Adaptation Across Prophage Islands\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ECryptic and lambdoid prophages (\u003Ccode\u003ECP4-44\u003C/code\u003E, \u003Ccode\u003ECPS-53\u003C/code\u003E, \u003Ccode\u003Ee14\u003C/code\u003E, \u003Ccode\u003ERac\u003C/code\u003E, \u003Ccode\u003EQin\u003C/code\u003E) exhibit sharp local GC drops (\u003Ccode\u003E34%\u201344%\u003C/code\u003E GC)\nrelative to the \u003Ccode\u003E50.8%\u003C/code\u003E GC \u003Cem\u003EE. coli\u003C/em\u003E host background. \u003Ccode\u003EOrfPredictor\u003C/code\u003E computes a prefix-sum 4-kb sliding GC bin (\u003Ccode\u003E0..43\u003C/code\u003E)\nat every nucleotide so hexamer codon emissions adapt seamlessly across prophage boundaries.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.vegalite.v6+json\u0026quot;' data-data='\u0026quot;{\u0026#9
