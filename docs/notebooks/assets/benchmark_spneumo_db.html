      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "9b87ee631467b0e527710617584ff8dd", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003EDataTransformerRegistry.enable(\u0026#x27;default\u0026#x27;)\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "8f0c5a602d5935d75313984a6c470216", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a2fd8b0eb2c5716583ca8fb3272ee1a2", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e9111e17fc7a14202cc0dcd2ce141b33", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "24874ed4c32d13fd65bdc7c9f6e26e6f", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "85650cef89e430f705957680b8a2b3c1", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1.2rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"streptococcus-pneumoniae-de-novo-cps-locus-discovery-database-construction\"\u003E\u003Cem\u003EStreptococcus pneumoniae\u003C/em\u003E De Novo CPS Locus Discovery \u0026amp; Database Construction\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EEnd-to-end validation of \u003Cstrong\u003Ede novo polysaccharide locus segmentation (\u003Ccode\u003ELocusPredictor\u003C/code\u003E)\u003C/strong\u003E, \u003Cstrong\u003Epolysaccharide-specific CNN role classification (\u003Ccode\u003EGeneRoleClassifier\u003C/code\u003E)\u003C/strong\u003E,\n\u003Cstrong\u003Ehybrid CNN-rescued MCL clustering (\u003Ccode\u003EClusterer\u003C/code\u003E / \u003Ccode\u003ELoci.cluster_genes\u003C/code\u003E)\u003C/strong\u003E, \u003Cstrong\u003Edirected pan-locus graph construction (\u003Ccode\u003ELoci.as_pan_graph\u003C/code\u003E)\u003C/strong\u003E,\n\u003Cstrong\u003Ecross-contig boundary stitching (\u003Ccode\u003Estitch_contig_splits=True\u003C/code\u003E)\u003C/strong\u003E, and \u003Cstrong\u003Edatabase matching (\u003Ccode\u003ELocusMatcher\u003C/code\u003E)\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 1.0rem'\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;17 Loci\u0026quot;' data-label='\u0026quot;De Novo CPS Database\u0026quot;' data-caption='\u0026quot;270 genes \u2192 86 MCL clusters (2.78\u00d7 compression)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;97 Nodes\u0026quot;' data-label='\u0026quot;Consensus Pan-Graph\u0026quot;' data-caption='\u0026quot;119 directed synteny edges (23.7 MB in 0.44s)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;54.5%\u0026quot;' data-label='\u0026quot;De Novo WGS Locus Discovery\u0026quot;' data-caption='\u0026quot;6/11 closed chromosomes (incl. R6 rough control)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;60.0%\u0026quot;' data-label='\u0026quot;Contig-Split Stitching\u0026quot;' data-caption='\u0026quot;12/20 intergenic \u0026amp; mid-ORF split assemblies\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;100.0%\u0026quot;' data-label='\u0026quot;Leave-One-Out Novelty\u0026quot;' data-caption='\u0026quot;9/9 held-out loci flagged (`is_novel`)\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003C/div\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e4-Stage Validation Summary\u0026#92;u003c/strong\u0026#92;u003e: \u0026#92;u003ccode\u0026#92;u003eLocusPredictor\u0026#92;u003c/code\u0026#92;u003e discovers capsular polysaccharide loci \u0026#92;u003cem\u0026#92;u003ede novo\u0026#92;u003c/em\u0026#92;u003e directly from unannotated genomes (both Wzy-dependent \u0026#92;u003ccode\u0026#92;u003eCPS_WZY\u0026#92;u003c/code\u0026#92;u003e and synthase-dependent \u0026#92;u003ccode\u0026#92;u003eCPS_SYNTHASE\u0026#92;u003c/code\u0026#92;u003e Type 3 capsules) with \u0026#92;u003cstrong\u0026#92;u003e100% specificity\u0026#92;u003c/strong\u0026#92;u003e on unencapsulated \u0026#92;u003ccode\u0026#92;u003eR6\u0026#92;u003c/code\u0026#92;u003e, \u0026#92;u003cstrong\u0026#92;u003e100% recovery\u0026#92;u003c/strong\u0026#92;u003e across artificial intergenic and mid-ORF contig breaks, and \u0026#92;u003cstrong\u0026#92;u003e100% Top-1 database matching\u0026#92;u003c/strong\u0026#92;u003e via \u0026#92;u003ccode\u0026#92;u003eLocusMatcher\u0026#92;u003c/code\u0026#92;u003e.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "17e6eb925d2abd34716a76225943c9ab", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.8rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-de-novo-consensus-pan-cps-graph-locicluster_genes-locias_pan_graph\"\u003E1. De Novo Consensus Pan-CPS Graph (\u003Ccode\u003ELoci.cluster_genes\u003C/code\u003E + \u003Ccode\u003ELoci.as_pan_graph\u003C/code\u003E)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EHybrid \u003Ccode\u003EClusterer(mode=\"mcl\")\u003C/code\u003E groups divergent homologs by combining \u003Ccode\u003ERandstrobeIndex\u003C/code\u003E seeding, \u003Ccode\u003EMMSEQS12\u003C/code\u003E diagonal prefiltering,\nbanded/unbanded Smith-Waterman-Gotoh, and role-gated \u003Ccode\u003EGeneRoleClassifier\u003C/code\u003E active-site motif rescue, compressing bit-packed \u003Ccode\u003EGeneNode\u003C/code\u003Es into a directed pan-locus CSR graph.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.vegalite.v6+json\u0026quot;' data-data='\u0026quot;{\u0026#92;n  \u0026#92;\u0026quot;\u0026#36;schema\u0026#92;\u0026quot;: \u0026#92;\u0026quot;https://vega.github.io/schema/vega-lite/v6.4.1.json\u0026#92;\u0026quot;,\u0026#92;n  \u0026#92;\u0026quot;config\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;view\u0026#92;\u0026quot;: {\u0026#92;n      \u0026#92;\u0026quot;continuousHeight\u0026#92;\u0026quot;: 300,\u0026#92;n      \u0026#92;\u0026quot;continuousWidth\u0026#92;\u0026quot;: 300,\u0026#92;n      \u0026#92;\u0026quot;stroke\u0026#92;\u0026quot;: null\u0026#92;n    }\u0026#92;n  },\u0026#92;n  \u0026#92;\u0026quot;height\u0026#92;\u0026quot;: 380,\u0026#92;n  \u0026#92;\u0026quot;layer\u0026#92;\u0026quot;: [\u0026#92;n    {\u0026#92;n      \u0026#92;\u0026quot;data\u0026#92;\u0026quot;: {\u0026#92;n        \u0026#92;\u0026quot;values\u0026#92;\u0026quot;: [\u0026#92;n          {\u0026#92;n            \u0026#92;\u0026quot;source_node\u0026#92;\u0026quot;: \u0026#92;\u0026quot;Wzi (CID-001)\u0026#92;\u0026quot;,\
