[project]
site_url = "https://seroverse.github.io/SeroRef/"
site_name = "SeroRef"
site_description = "De novo bacterial surface polysaccharide locus prediction, 1D-CNN gene role classification, and Strain–Assembly–Locus reference database"
site_author = "Tom Stanton"
copyright = "Copyright &copy; 2026 Tom Stanton — SeroVerse"

repo_url = "https://github.com/SeroVerse/SeroRef"
repo_name = "SeroVerse/SeroRef"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = [
    { "Home" = "index.md" },
    { "Architecture & Algorithms" = "architecture.md" },
  ] },
  { "Benchmarks & Notebooks" = [
    { "Overview" = "notebooks/index.md" },
    { "4-Tier SeroRef Database Curation" = "notebooks/curate-seroref.md" },
    { "Prophage & Bacterial ORFs" = "notebooks/prophage-orfs.md" },
    { "CNN Gene Role Classifier" = "notebooks/gene-classifier.md" },
    { "S. pneumoniae De Novo CPS Database" = "notebooks/spneumo-serotyping.md" },
  ] },
  { "API Reference" = [
    { "Overview" = "reference/index.md" },
    { "seroref.genes" = "reference/genes.md" },
    { "seroref.loci" = "reference/loci.md" },
    { "seroref.db" = "reference/db.md" },
  ] },
  { "Community" = [
    "citation.md",
    "conduct.md",
    "contributing.md",
    "releases.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/dna"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SeroVerse/SeroRef"
name = "SeroVerse/SeroRef on GitHub"

[project.extra.status]
new = "Recently added"
deprecated = "Deprecated"

[project.plugins.search]
enabled = true

[project.plugins.tags]
enabled = true

[project.plugins.autorefs]
enabled = true

[project.plugins.gh-admonitions]
enabled = true

[project.plugins.glightbox]
enabled = true

[project.plugins.llmstxt]
enabled = true
markdown_description = "SeroRef: De novo bacterial surface polysaccharide locus prediction, single-pass bacterial & prophage ORF calling, multi-scale 1D-CNN gene role classification, syntenic pan-locus matching, and the 4-tier Strain–Assembly–Locus reference database."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Overview & Architecture" = [
  { "index.md" = "Getting started, quickstart, and performance benchmarks" },
  { "architecture.md" = "Single-pass HMM-Viterbi ORF caller, multi-scale 1D-CNN role classifier, ACP-DP locus segmentation, syntenic pan-locus matching, and 4-tier SeroRefRecords curation" },
]
"Benchmarks & Notebooks" = [
  { "notebooks/index.md" = "Interactive Marimo benchmark notebooks and 16:9 slide decks" },
  { "notebooks/curate-seroref.md" = "Four-tier de novo SeroRef reference database curation across ENA NCTC3000, DSMZ StrainInfo v2, NCBI landmark BGC sweeps, and NCBI accession, PubMed elink & strain assembly resolution" },
  { "notebooks/prophage-orfs.md" = "Single-pass bacterial and prophage ORF prediction benchmark on E. coli K-12 MG1655 (CP014225.1) and 9 embedded prophage islands" },
  { "notebooks/gene-classifier.md" = "Polysaccharide-specific multi-scale 1D-CNN gene role classifier training, Optuna TPE tuning, and Numba layer representation sweep" },
  { "notebooks/spneumo-serotyping.md" = "S. pneumoniae de novo CPS locus discovery, hybrid MCL clustering, pan-locus graph construction, contig-split stitching, and database matching" },
]
"API Reference" = [
  { "reference/genes.md" = "seroref.genes: OrfPredictor, GeneRoleClassifier, GeneRole, and Genes/Indels containers" },
  { "reference/loci.md" = "seroref.loci: LocusArchetype, LocusSegmenter, LocusMatcher, LocusPredictor, and Locus/Loci models" },
  { "reference/db.md" = "seroref.db: SeroRefRecord, SeroRefRecords, LociCacheBundle, and 4-tier curation pipeline" },
]
"Community" = [
  { "citation.md" = "How to cite SeroRef in academic publications" },
  { "conduct.md" = "Contributor Covenant Code of Conduct" },
  { "contributing.md" = "Local development setup, testing, and pull request guidelines" },
  { "releases.md" = "Version history and changelog" },
]

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
group_by_category = true
summary = true
inherited_members = false
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = { base_path = ["."] }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
